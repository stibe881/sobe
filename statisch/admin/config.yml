# Konfiguration der Redaktionsoberfläche (Sveltia CMS).
backend:
  name: github
  repo: stibe881/sobe
  branch: main
media_folder: statisch/wp-content/uploads/redaktion
public_folder: /wp-content/uploads/redaktion
locale: de
collections:
  - name: news
    label: News-Beiträge
    label_singular: News-Beitrag
    folder: quelle/news
    extension: md
    format: yaml-frontmatter
    create: true
    slug: '{{fields.titel | localize}}'
    sortable_fields: [datum, titel]
    view_filters:
      - { label: Aktuelles, field: kategorien, pattern: aktuelles }
      - { label: Medien, field: kategorien, pattern: medien }
    fields:
      - { name: titel, label: Titel, widget: string }
      - { name: datum, label: Datum, widget: string,
          hint: 'Format JJJJ-MM-TT, z. B. 2026-09-01' }
      - name: kategorien
        label: Kategorien
        widget: select
        multiple: true
        default: [aktuelles]
        options:
          - { label: Aktuelles, value: aktuelles }
          - { label: Medien, value: medien }
          - { label: Spendenprojekte, value: spendenprojekte }
      - name: body
        label: Beitragstext
        widget: markdown
        hint: 'Bilder bitte mit kurzem Alternativtext einfügen –
          er beschreibt für blinde Besucherinnen und Besucher,
          was auf dem Bild zu sehen ist.'
  - name: team
    label: Team (Organisations-Seite)
    label_singular: Person
    folder: quelle/team
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: name
    slug: '{{fields.name | localize}}'
    sortable_fields: [reihenfolge, name]
    fields:
      - { name: name, label: Name, widget: string }
      - { name: funktion, label: Funktion, widget: string }
      - name: gruppe
        label: Gruppe
        widget: select
        options:
          - Geschäftsleitung
          - Stabstellen
          - Angebots- und Fachbereichsleitungen
      - { name: bild, label: Porträtfoto, widget: image, required: false,
          hint: 'Querformat, ca. 800×540 Pixel' }
      - { name: email, label: E-Mail, widget: string, required: false }
      - { name: reihenfolge, label: Reihenfolge, widget: number,
          hint: 'Kleinere Zahl = weiter vorne in der Gruppe' }
      - { name: body, label: ' ', widget: hidden, default: '' }
  - name: stellen
    label: Stelleninserate
    label_singular: Stelleninserat
    folder: quelle/stellen
    extension: md
    format: yaml-frontmatter
    create: true
    identifier_field: titel
    slug: '{{fields.titel | localize}}'
    sortable_fields: [reihenfolge, titel]
    fields:
      - { name: titel, label: Titel, widget: string,
          hint: 'z. B. «Logopädin/Logopäde 40–100 %»' }
      - { name: bewerbungslink, label: Bewerbungslink, widget: string,
          hint: 'Link zum Inserat im Bewerbungsportal (umantis)' }
      - { name: reihenfolge, label: Reihenfolge, widget: number, default: 500 }
      - { name: body, label: Beschrieb, widget: markdown }
  - name: texte
    label: Textbausteine
    files:
      - name: aufnahme-hinweis
        label: 'Aufnahme/Intake: Hinweis zur Platzsituation'
        file: quelle/texte/aufnahme-hinweis.md
        fields:
          - { name: titel, label: Bezeichnung, widget: string }
          - { name: body, label: Text, widget: markdown }
