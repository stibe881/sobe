<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redaktion · SONNENBERG</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="/redaktion/stil.css">
</head>
<body>

<!-- Anmeldung. Solange sie sichtbar ist, bleibt der Rest verborgen. -->
<section id="ansicht-anmelden" class="arbeit" hidden>
  <div class="karte anmeldekasten">
    <h1>Redaktion</h1>
    <p class="wo">Bitte melden Sie sich mit dem Redaktionspasswort an.</p>
    <form id="form-anmelden">
      <div class="feld">
        <label for="passwort">Passwort</label>
        <input type="password" id="passwort" autocomplete="current-password" required>
      </div>
      <button type="submit" class="primaer">Anmelden</button>
    </form>
    <div id="meldung-anmelden"></div>
  </div>
</section>

<div class="huelle" id="huelle" hidden>
  <div class="leiste" id="leiste">
    <div class="marke">
      <div>
        <strong>SONNENBERG</strong>
        <span>Redaktion</span>
      </div>
      <button class="burger" id="burger" aria-expanded="false" aria-controls="hauptnav">Menü</button>
    </div>
    <nav id="hauptnav" aria-label="Bereiche"></nav>
    <div class="fuss">
      <a id="webseite-ansehen" href="/" target="_blank" rel="noopener">Webseite ansehen</a>
      <button id="abmelden">Abmelden</button>
    </div>
  </div>

  <div class="inhalt">
    <header class="kopf">
      <h1 id="bereich-titel">Übersicht</h1>
      <span id="stand" class="still"></span>
      <button id="knopf-veroeffentlichen" class="primaer">Veröffentlichen</button>
    </header>
    <div id="meldung" role="status" aria-live="polite"></div>
    <main class="arbeit" id="arbeit"></main>
  </div>
</div>

<script src="/redaktion/oberflaeche.js"></script>
</body>
</html>
